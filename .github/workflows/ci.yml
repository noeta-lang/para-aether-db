name: CI

# The para/aether_db package's CI: check + test every example program with a pinned released
# `noeta`. This package is pure Noeta, but its examples compose para/db's native driver, so the
# pinned Rust toolchain is installed too (the composed toolchain cargo-builds the extension crate).
#
# NOTE: these workflows go green once the noeta toolchain repo is published under
# github.com/noeta-lang/noeta and this repo's pre-publish `file:///` git deps are flipped to it
# (tracked in the pre-alpha run-list). Until then they fail at the noeta-install step by design.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned in lockstep with the toolchain repo's own CI (dtolnay/rust-toolchain@1.97.0 there): the
# NOETA_VERSION below is the toolchain release the examples are proven against. Bumping is
# deliberate — raise it here and in `release.yml` together.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NOETA_VERSION: v0.1.0

jobs:
  examples:
    name: Examples (noeta check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The examples pull para/db, whose native driver the composed toolchain cargo-builds — so the
      # Rust toolchain is required even though this package itself is pure Noeta.
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Install noeta ${{ env.NOETA_VERSION }}
        run: |
          DIST="noeta-${NOETA_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL "https://github.com/noeta-lang/noeta/releases/download/${NOETA_VERSION}/${DIST}.tar.gz" | tar -xz
          echo "${PWD}/${DIST}" >> "$GITHUB_PATH"
      - name: noeta check + test every example
        run: |
          for ex in examples/*/; do
            echo "== ${ex}"
            for f in "${ex}"*.noe; do
              (cd "${ex}" && noeta check "$(basename "$f")" && noeta test "$(basename "$f")")
            done
          done
