[package]
name = "noeta/aether_sessions_db"
version = "0.1.0"

# The opt-in to STORED sessions is this one manifest change: alongside para/aether and para/db, the
# app adds `para/aether-db` to its `para` scope. All three bind under the single `para` scope key as
# an array (multi-package-per-scope resolution). An app that referenced `para.aether_db.DbSessions`
# WITHOUT this dependency would get an ordinary unresolved-import error — that error plus the
# package's docs are the discoverability story; there is no bespoke compiler diagnostic.
[dependencies]
# file:// is the pre-publish form; flips to the hosted registry / github URLs at publish.
para = [
    { git = "file:///home/niklas/Code/para/para-aether", tag = "v0.1.0" },
    { git = "file:///home/niklas/Code/para/para-db", tag = "v0.1.0" },
    { path = "../.." },
]

# para/db ships a native Rust extension (the SQLite driver para/aether-db stores rows through); the
# root app must authorize it. para/aether-db itself is pure Noeta and needs no trust entry.
[trust]
native = ["para/db"]
